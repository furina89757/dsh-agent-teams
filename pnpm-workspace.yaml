# Upstream published some 0.1.5-rc packages whose dependency ranges reject
# prereleases (`^0.1.5` cannot match `0.1.5-rc.2`). Pin the one package that
# trips the resolver so a local build can resolve the rc.2 toolchain.
overrides:
  '@deepseek-ai/dsh-invariants': 0.1.5-rc.2
