# Single-package workspace: the build runs in the repository root.
packages:
  - .

# Preserved from the upstream repository: the optional native terminal
# dependency stays unbuilt in this project.
allowBuilds:
  node-pty: false
  # Transitive devDependencies of the 0.1.5-rc toolchain. Their native/postinstall
  # scripts are not needed to typecheck or bundle this plugin, but pnpm 11 fails
  # a `pnpm install` outright while they are undecided — which aborts the
  # `prepare` build a git-source install runs inside its extracted tarball.
  '@deepseek-ai/dsh-subprocess-local': false
  '@google/genai': false
  koffi: false
  protobufjs: false

minimumReleaseAgeExclude:
  - '@deepseek-ai/dsh-agent-default-model@0.1.5-rc.2'
  - '@deepseek-ai/dsh-agent-presets@0.1.5-rc.2'
  - '@deepseek-ai/dsh-agent@0.1.5-rc.2'
  - '@deepseek-ai/dsh-api-gateway@0.1.5-rc.2'
  - '@deepseek-ai/dsh-api-session-controller@0.1.5-rc.2'
  - '@deepseek-ai/dsh-atomic-write@0.1.5-rc.2'
  - '@deepseek-ai/dsh-attachment@0.1.5-rc.2'
  - '@deepseek-ai/dsh-brand@0.1.5-rc.2'
  - '@deepseek-ai/dsh-chunked-list@0.1.5-rc.2'
  - '@deepseek-ai/dsh-client-connection@0.1.5-rc.2'
  - '@deepseek-ai/dsh-client-file-upload@0.1.5-rc.2'
  - '@deepseek-ai/dsh-client-locale@0.1.5-rc.2'
  - '@deepseek-ai/dsh-client-store@0.1.5-rc.2'
  - '@deepseek-ai/dsh-client-ui-chat@0.1.5-rc.2'
